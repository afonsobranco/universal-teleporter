<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Teleporter</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:-apple-system,'SF Pro Display',BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --bg:#F5F5F7;--text:#1D1D1F;--sub:#6E6E73;--sep:rgba(0,0,0,.09);
  --glass:rgba(255,255,255,.74);--gb:rgba(255,255,255,.56);
  --ss:0 2px 20px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.04);
  --sm:0 8px 40px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.05);
  --fs:clamp(28px,5.1vw,64px);--r:18px;--ghost:rgba(0,0,0,.38)
}
[data-theme=dark]{
  --bg:#0D0D0F;--text:#F5F5F7;--sub:#98989D;--sep:rgba(255,255,255,.08);
  --glass:rgba(26,26,28,.82);--gb:rgba(255,255,255,.10);
  --ss:0 2px 20px rgba(0,0,0,.35),0 1px 4px rgba(0,0,0,.25);
  --sm:0 8px 40px rgba(0,0,0,.48),0 2px 8px rgba(0,0,0,.32);--ghost:rgba(255,255,255,.32)
}
html,body{width:100%;height:100%;background:var(--bg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .3s}
body{padding:10vh 10vw!important;width:100%;height:100%;background:var(--bg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .3s;}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px);transition:background .5s}
.o1{width:680px;height:680px;background:rgba(0,122,255,.07);top:-200px;left:-150px}
.o2{width:560px;height:560px;background:rgba(255,45,85,.055);bottom:-190px;right:-130px}
.o3{width:460px;height:460px;background:rgba(88,86,214,.055);top:40%;left:58%;transform:translate(-50%,-50%)}
.o4{width:320px;height:320px;background:rgba(52,199,89,.045);bottom:24%;left:9%}
[data-theme=dark] .o1{background:rgba(0,122,255,.14)}[data-theme=dark] .o2{background:rgba(255,45,85,.12)}
[data-theme=dark] .o3{background:rgba(88,86,214,.13)}[data-theme=dark] .o4{background:rgba(52,199,89,.09)}
#app{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden}
.topbar{width:100%;max-width:880px;display:flex;align-items:center;gap:8px;padding-top:clamp(12px,2vh,24px);flex-shrink:0}
.logo{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--sub);text-transform:uppercase;flex:1}
.ib{width:30px;height:30px;border-radius:50%;border:none;background:rgba(128,128,128,.1);color:var(--sub);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;font-family:var(--font);flex-shrink:0}
.ib:hover{background:rgba(128,128,128,.18);color:var(--text)}
#cbadge{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:20px;opacity:0;transform:translateY(-5px);transition:opacity .25s,transform .25s}
#cbadge.vis{opacity:1;transform:translateY(0)}
#sbar{width:100%;max-width:880px;font-size:10px;color:var(--sub);height:15px;margin-top:4px;flex-shrink:0;display:flex;align-items:center;gap:16px;opacity:.65}
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle}
.sl{background:#34C759}.so{background:#FF9500}.sg{background:var(--sub);animation:bl 1.2s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
#iz{width:100%;max-width:880px;margin-top:clamp(24px,8vh,100px);transition:margin-top .45s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
#iz.cond{margin-top:clamp(14px,2.8vh,28px)}
.iwrap{position:relative;width:100%;overflow:hidden}
#inp{display:block;width:100%;font-family:var(--font);font-size:var(--fs);font-weight:200;letter-spacing:-.025em;color:var(--text);background:transparent;border:none;outline:none;caret-color:#007AFF;position:relative;z-index:2;white-space:nowrap;padding:0;line-height:1.2;transition:opacity .28s}
#inp::placeholder{color:rgba(128,128,128,.35);font-weight:200}
#ghost{position:absolute;top:0;left:0;font-size:var(--fs);font-weight:200;letter-spacing:-.025em;line-height:1.2;pointer-events:none;z-index:1;color:var(--ghost);white-space:pre}
#ambig{display:none;margin-top:9px;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub)}
#ambig.vis{display:flex}
.amc{padding:4px 11px;border-radius:14px;border:1px solid var(--sep);background:rgba(128,128,128,.08);font-size:11px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .15s;font-family:var(--font)}
.amc:hover{border-color:currentColor;color:var(--text)}
.uln{height:1px;background:var(--sep);margin-top:12px;position:relative;overflow:hidden}
.uln::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,#007AFF,#00C7BE);transition:left .55s cubic-bezier(.25,1,.5,1)}
.uln.on::after{left:0}
#hint{margin-top:8px;font-size:12px;font-weight:400;letter-spacing:.01em;color:var(--sub);min-height:15px;transition:color .2s}
.kbh{font-size:10px;color:rgba(128,128,128,.33);margin-top:5px;letter-spacing:.02em}
.kbh kbd{display:inline-block;padding:1px 5px;background:rgba(128,128,128,.1);border-radius:4px;font-family:var(--font);font-size:9px}
#sg{width:100%;max-width:880px;display:none;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;flex-shrink:0}
.sc{background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--gb);border-radius:var(--r);padding:14px 16px 16px;cursor:pointer;box-shadow:var(--ss);transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s;animation:fu .3s cubic-bezier(.34,1.56,.64,1) both}
.sc:nth-child(2){animation-delay:.05s}.sc:nth-child(3){animation-delay:.1s}
.sc:hover{transform:translateY(-3px) scale(1.01);box-shadow:var(--sm)}.sc:active{transform:translateY(-1px)}
.scl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.scv{font-size:clamp(17px,2.4vw,29px);font-weight:300;letter-spacing:-.02em;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scs{font-size:11px;font-weight:400;color:var(--sub);margin-left:3px}
.scf{font-size:10px;color:var(--sub);margin-top:3px;font-style:italic}
#rc{display:none;width:100%;max-width:880px;background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--gb);border-radius:22px;box-shadow:var(--sm);margin-top:20px;overflow:hidden;animation:su .38s cubic-bezier(.34,1.56,.64,1) both;flex-shrink:0}
.rch{display:flex;align-items:center;gap:5px;padding:13px 18px 9px;border-bottom:1px solid var(--sep);flex-wrap:wrap}
.rct{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1;min-width:50px}
.rcctrl{display:flex;align-items:center;gap:4px;flex-shrink:0}
.sps{display:flex;gap:3px}
.sp{padding:2px 8px;border-radius:11px;border:1px solid var(--sep);font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);background:transparent;cursor:pointer;transition:all .15s;font-family:var(--font)}
.sp.act{color:#fff;border-color:transparent}
#cw{display:none;padding:8px 18px;border-bottom:1px solid var(--sep);background:rgba(128,128,128,.04)}
#ci{width:100%;font-size:clamp(14px,1.8vw,20px);font-weight:300;letter-spacing:-.02em;color:var(--text);background:transparent;border:none;outline:none;caret-color:#5856D6;font-family:var(--font)}
#ci::placeholder{color:rgba(128,128,128,.28);font-weight:300}
#rrows{padding:3px 0;max-height:clamp(180px,38vh,360px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--sep) transparent}
#rrows::-webkit-scrollbar{width:3px}#rrows::-webkit-scrollbar-thumb{background:var(--sep);border-radius:4px}
.rsrc{display:flex;align-items:baseline;padding:10px 18px 7px;border-bottom:1px solid var(--sep);margin-bottom:3px;gap:6px;flex-wrap:wrap}
.rsrcv{font-size:clamp(16px,2.1vw,24px);font-weight:200;letter-spacing:-.025em;color:var(--text)}
.rsrcu{font-size:12px;color:var(--sub)}.rsrcf{font-size:11px;color:var(--sub);font-style:italic}
.rsrcc{font-size:12px;font-weight:300;color:var(--sub);margin-left:auto;padding-left:10px;white-space:nowrap}
.rng{padding:8px 18px;border-bottom:1px solid var(--sep);margin-bottom:3px}
.rngl{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);margin-bottom:6px}
.rngr{display:flex;gap:18px;font-size:clamp(13px,1.7vw,18px);font-weight:300;color:var(--text);flex-wrap:wrap}
.rngi{display:flex;flex-direction:column;gap:1px}
.rngs{font-size:9px;color:rgba(128,128,128,.5)}
.rr{display:flex;align-items:center;padding:8px 18px;transition:background .12s;cursor:default;gap:3px}
.rr:hover{background:rgba(128,128,128,.04)}.rr.hl{background:rgba(0,122,255,.05)}.rr.pr{background:rgba(255,149,0,.04)}
.rpn{width:20px;height:20px;border-radius:5px;border:none;background:transparent;color:rgba(128,128,128,.28);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:color .15s;flex-shrink:0}
.rpn:hover{color:#FF9500}.rpn.pon{color:#FF9500}
.rlbl{flex:1;font-size:12px;font-weight:400;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rcmp{font-size:12px;font-weight:300;color:rgba(128,128,128,.5);margin-left:8px;white-space:nowrap;flex-shrink:0}
.rval{font-size:15px;font-weight:300;letter-spacing:-.02em;color:var(--text);white-space:nowrap}
.rfrac{font-size:9px;color:rgba(128,128,128,.48);font-style:italic;margin-left:3px;white-space:nowrap}
.rsym{font-size:10px;font-weight:500;color:var(--sub);min-width:30px;text-align:left;margin-left:5px;flex-shrink:0}
.racts{display:flex;gap:2px;opacity:0;transition:opacity .15s;flex-shrink:0;margin-left:3px}
.rr:hover .racts{opacity:1}
.ra{width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;font-size:12px;font-family:var(--font)}
.ra:hover{background:rgba(128,128,128,.12);color:var(--text)}.ra.ok{color:#34C759!important;background:rgba(52,199,89,.12)!important}
.rdiv{height:1px;background:var(--sep);margin:2px 18px}
.fnote{font-size:10px;color:var(--sub);padding:4px 18px 8px;opacity:.6}
.ew{position:relative}
#em{display:none;position:absolute;right:0;top:calc(100% + 5px);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--gb);border-radius:12px;box-shadow:var(--sm);padding:4px;min-width:148px;z-index:60;animation:fu .15s ease both}
#em.vis{display:block}
.emi{padding:7px 11px;border-radius:7px;font-size:12px;font-weight:500;color:var(--text);cursor:pointer;transition:background .1s;white-space:nowrap}
.emi:hover{background:rgba(128,128,128,.1)}
#qm{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);align-items:center;justify-content:center}
#qm.vis{display:flex}
.qbox{background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--gb);border-radius:22px;box-shadow:var(--sm);padding:22px;text-align:center;max-width:220px;width:90%}
.qlbl{font-size:12px;font-weight:500;color:var(--text);margin-bottom:13px;line-height:1.4;word-break:break-all}
#qimg{width:150px;height:150px;border-radius:10px;margin:0 auto;display:block;background:rgba(128,128,128,.08)}
.qcl{margin-top:12px;font-size:12px;color:var(--sub);cursor:pointer;display:block;text-align:center}
.qcl:hover{color:var(--text)}
#ch{position:fixed;right:0;top:0;bottom:0;width:268px;z-index:200;background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-left:1px solid var(--gb);box-shadow:-8px 0 40px rgba(0,0,0,.1);overflow-y:auto;transform:translateX(105%);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
#ch.vis{transform:translateX(0)}
.chh{display:flex;align-items:center;justify-content:space-between;padding:16px 15px 11px;border-bottom:1px solid var(--sep);position:sticky;top:0;background:var(--glass);backdrop-filter:blur(20px)}
.cht{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.chs{padding:12px 15px 3px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.chr{padding:4px 15px;font-size:11px;color:var(--text);line-height:1.5}
.chx{font-weight:600;color:#007AFF;font-family:monospace;font-size:11px}
#hist{width:100%;max-width:880px;display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:13px 0 20px;margin-top:auto;flex-shrink:0}
#hist::-webkit-scrollbar{display:none}
.hc{flex-shrink:0;padding:4px 10px;border-radius:20px;border:1px solid var(--sep);background:rgba(128,128,128,.07);font-size:11px;font-weight:400;color:var(--sub);cursor:pointer;transition:all .2s;white-space:nowrap;font-family:var(--font)}
.hc:hover{color:#007AFF;border-color:rgba(0,122,255,.3);background:rgba(0,122,255,.06)}
.hcp{flex-shrink:0;padding:4px 10px;border-radius:20px;border:1px solid rgba(255,149,0,.38);background:rgba(255,149,0,.08);font-size:11px;font-weight:500;color:#FF9500;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:var(--font)}
.hcp:hover{background:rgba(255,149,0,.16)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(28,28,30,.93);backdrop-filter:blur(12px);color:#fff;font-size:13px;font-weight:500;font-family:var(--font);padding:8px 17px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;z-index:999}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes su{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:600px){
  /* Layout */
  #sg{grid-template-columns:1fr}
  /* Topbar — shrink buttons on very narrow screens */
  .logo{font-size:9px;letter-spacing:.08em}
  .ib{width:26px;height:26px;font-size:12px}
  #cbadge{display:none}
  /* Input */
  #iz{margin-top:clamp(16px,5vh,48px)}
  /* Result card header */
  .sps{display:none}
  .rcctrl{gap:2px}
  .rch{padding:10px 12px 8px}
  /* Result rows — tighter on mobile */
  .rr{padding:9px 12px}
  .rsrc{padding:9px 12px 7px}
  .rng{padding:7px 12px}
  .rdiv{margin:2px 12px}
  .fnote{padding:4px 12px 8px}
  .rval{font-size:14px}
  .rlbl{font-size:11px}
  /* Panels full-width on mobile */
  #ch{width:100%;border-left:none;border-bottom:1px solid var(--gb)}
  /* History chips smaller */
  .hc,.hcp{font-size:10px;padding:3px 8px}
  /* Suggestion cards */
  .sc{padding:11px 13px 13px}
  /* Compare input */
  #ci{font-size:14px}

}
@media(max-width:380px){
  .ib{width:24px;height:24px;font-size:11px}
  #fmtbtn{display:none}
}
.rr.nav-focus{background:rgba(0,122,255,.09)!important;outline:none}

.ib.fmt-on{background:rgba(0,122,255,.12)!important;color:#007AFF!important}
.ib.listening{background:rgba(255,59,48,.16)!important;color:#FF3B30!important;animation:bl 1s infinite}
#pf-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px}
#pf-overlay.vis{display:flex}
#pf{width:100%;max-width:480px;max-height:88vh;background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--gb);border-radius:22px;box-shadow:var(--sm);display:flex;flex-direction:column;overflow:hidden;animation:su .3s cubic-bezier(.34,1.56,.64,1) both}
#pf-body{overflow-y:auto;padding:16px 18px 20px;flex:1;scrollbar-width:thin;scrollbar-color:var(--sep) transparent}
#pf-body::-webkit-scrollbar{width:3px}#pf-body::-webkit-scrollbar-thumb{background:var(--sep);border-radius:4px}
.pftotal{margin-top:10px;font-size:24px;font-weight:200;letter-spacing:-.02em;color:var(--text);line-height:1.3}
.pftotalsub{display:flex;gap:14px;margin-top:4px;flex-wrap:wrap}
.pftotalsub span{font-size:13px;font-weight:300;color:var(--sub)}
.pfrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--sep)}
.pfrow:last-child{border-bottom:none}
.pfsym{font-weight:600;color:var(--sub);min-width:60px;font-size:12px}
.pfval{color:var(--text);font-weight:300;font-size:13px;margin-left:auto;white-space:nowrap}
.spark-up{color:#34C759}.spark-dn{color:#FF3B30}
textarea.pfta{width:100%;height:80px;background:rgba(128,128,128,.06);border:1px solid var(--sep);border-radius:10px;padding:10px;font-family:var(--font);font-size:13px;color:var(--text);resize:none;outline:none;transition:border-color .15s;line-height:1.5}
textarea.pfta:focus{border-color:rgba(0,122,255,.4)}
.alert-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.alert-grid-full{grid-column:1/-1}
.alert-inp{width:100%;background:rgba(128,128,128,.06);border:1px solid var(--sep);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s}
.alert-inp:focus{border-color:rgba(0,122,255,.4)}
select.alert-sel{width:100%;background:rgba(128,128,128,.06);border:1px solid var(--sep);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--text);font-family:var(--font);outline:none;cursor:pointer;appearance:none;-webkit-appearance:none}
.alert-set-btn{width:100%;padding:9px;border-radius:10px;border:none;background:#007AFF;color:#fff;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:opacity .15s}
.alert-set-btn:hover{opacity:.88}
@media(max-width:600px){
  #pf-overlay{align-items:flex-end;padding:0}
  #pf{max-width:100%;max-height:82vh;border-radius:22px 22px 0 0}
}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>
<div id="qm"><div class="qbox"><div class="qlbl" id="qlbl"></div><img id="qimg" alt="QR"/><span class="qcl" id="qcl" data-i18n="qClose">Close</span></div></div>
<div id="ch">
  <div class="chh"><span class="cht" data-i18n="guideTitle">Syntax Guide</span><button class="ib" id="chcl">✕</button></div>
  <div id="chbody"></div>
</div>
<div id="pf-overlay">
<div id="pf">
  <div class="chh"><span class="cht" data-i18n="pfTitle">Portfolio</span><button class="ib" id="pfcl">✕</button></div>
  <div id="pf-body">
    <div style="font-size:11px;color:var(--sub);margin-bottom:8px"><span data-i18n="pfHelp">One holding per line:</span> <span class="chx">BTC: 1.5</span></div>
    <textarea class="pfta" id="pfta" placeholder="BTC: 1.5&#10;ETH: 10&#10;SOL: 100"></textarea>
    <div class="pftotal" id="pftotal">—</div>
    <div class="pftotalsub" id="pftotalsub"></div>
    <div id="pfrows" style="margin-top:12px"></div>
    <div class="chs" style="padding:16px 0 8px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)" data-i18n="rateAlert">Rate Alert</div>
    <div class="alert-grid">
      <select class="alert-sel" id="alunit"></select>
      <select class="alert-sel" id="aldir"><option value="above" data-i18n="above">above</option><option value="below" data-i18n="below">below</option></select>
      <input class="alert-inp alert-grid-full" id="alprice" type="number" placeholder="Target price in USD" data-i18n-ph="alPrice"/>
      <button class="alert-set-btn alert-grid-full" id="albtn" data-i18n="setAlert">Set Alert 🔔</button>
    </div>
    <div id="allist" style="margin-top:10px;font-size:11px;color:var(--sub)"></div>
  </div>
</div>
</div>

// ── LOOKUP ───────────────────────────────────────────────
function resolveUnit(raw){
  if(!raw)return null;
  const s=raw.toLowerCase().trim();
  if(ALIAS[s])return ALIAS[s];
  const ns=s.replace(/\s+/g,'').replace(/[°º²³]/g,'');
  if(ALIAS[ns])return ALIAS[ns];
  for(const c of Object.values(CAT))if(c.units&&(c.units[s]||c.units[ns]))return c.units[s]?s:ns;
  const sg=ns.endsWith('s')?ns.slice(0,-1):null;
  if(sg){if(ALIAS[sg])return ALIAS[sg];for(const c of Object.values(CAT))if(c.units&&c.units[sg])return sg;}
  return null;
}
function getCat(k){if(!k)return null;for(const[n,c] of Object.entries(CAT))if(c.units&&c.units[k])return n;return null;}

// ── CONVERSION ───────────────────────────────────────────
function convert(val,from,to){
  const fc=getCat(from),tc=getCat(to);
  if(!fc||!tc||isNaN(val))return null;
  if(fc!==tc){
    if(fc==='crypto'&&tc==='currency'){const usd=val*CAT.crypto.units[from].usd;return usd*CAT.currency.units[to].rate;}
    if(fc==='currency'&&tc==='crypto'){const usd=val/CAT.currency.units[from].rate;return usd/CAT.crypto.units[to].usd;}
    return null;
  }
  const cat=CAT[fc];
  if(cat.special==='temp'){const c=from==='c'?val:from==='f'?(val-32)*5/9:val-273.15;return to==='c'?c:to==='f'?c*9/5+32:c+273.15;}
  if(cat.special==='currency')return(val/cat.units[from].rate)*cat.units[to].rate;
  if(cat.special==='crypto')return(val*cat.units[from].usd)/cat.units[to].usd;
  if(cat.special==='fuel'){const kml=from==='l100'?100/val:val*cat.units[from].f;return to==='l100'?100/kml:kml/cat.units[to].f;}
  return(val*cat.units[from].f)/cat.units[to].f;
}

// ── FORMATTING ───────────────────────────────────────────
function fmt(n){
  if(n===null||n===undefined||isNaN(n))return'—';
  const a=Math.abs(n);if(a===0)return'0';
  if(a>=1e15||(a>0&&a<1e-8))return n.toExponential(3);
  const d=a>=100000?1:a>=10000?2:a>=1000?3:a>=100?4:a>=10?5:5;
  const s=n.toFixed(d).replace(/\.?0+$/,'');
  const[i,dec]=s.split('.');
  const ic=i.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const us=dec?ic+'.'+dec:ic;
  if(!ST?.euFormat)return us;
  return us.replace(/,/g,'§').replace(/\./g,',').replace(/§/g,'.');
}
function toFrac(n){
  if(!n||isNaN(n))return null;
  const w=Math.floor(n),d=n-w;if(d<.03)return null;
  for(const[v,s]of FRS)if(Math.abs(d-v)<.03)return w?w+' '+s:s;
  return null;
}
function fmtFrac(n,unit){if(!CKNG.has(unit))return null;const f=toFrac(n);return f?'('+f+')':null;}

// ── SAFE EVAL ────────────────────────────────────────────
function safeEval(e){
  const c=String(e).replace(/[^0-9\.\+\-\*\/\(\)\s]/g,'').trim();
  if(!c||!/\d/.test(c))return NaN;
  try{return Function('"use strict";return('+c+')')();}catch{return NaN;}
}

// ── PARSING ──────────────────────────────────────────────
const RR=/^([\d.]+)\s*[-–]\s*([\d.]+)\s*([°º]?[a-zA-Z°²³\/]+(?:\s+[a-zA-Z]+)?)\s*(?:(?:to|in|→)\s*([°º]?[a-zA-Z°²³\/]+))?$/i;
const RC=/^([\d.]+)\s*([a-zA-Z'\"°²³]+)\s+([\d.]+)\s*([a-zA-Z'\"°²³]+)\s*(?:(?:to|in|→)\s*([a-zA-Z°²³]+))?$/i;
const RF=/^([0-9\s\+\-\*\/\(\)\.]+?)\s*([°º]?[a-zA-Z°²³]+(?:\s+[a-zA-Z]+)?)\s*(?:(?:to|in|→)\s*([°º]?[a-zA-Z°²³]+))?$/i;
const RM=/^([\d,]+\.?\d*)\s*([°º]?[a-zA-Z°º²³\/]+(?:\s+[a-zA-Z]+)?)\s*(?:(?:to|in|→|=)\s*([°º]?[a-zA-Z°º²³\/]+(?:\s+[a-zA-Z]+)?))?$/i;
const RU=/^([a-zA-Z°]+(?:\s+[a-zA-Z]+)?)\s*(?:(?:to|in|→)\s*([a-zA-Z°]+))?$/i;

const POUNDISH=['pound','pounds','libra','libras'];
// Currency symbols → codes. Multi-character symbols first so "R$" isn't read as "$".
const SYM2CODE=[['us$','usd'],['r$','brl'],['ca$','cad'],['nz$','nzd'],['hk$','hkd'],['mx$','mxn'],['a$','aud'],['s$','sgd'],['cn¥','cny'],['zł','pln'],
  ['€','eur'],['$','usd'],['£','gbp'],['¥','jpy'],['₹','inr'],['₩','krw'],['₪','ils'],['₽','rub'],['₺','try'],['₱','php'],['₫','vnd'],['฿','thb'],['₴','uah'],['₦','ngn']];
const _reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function prepInput(raw){
  // Strip accents so "quilómetros", "dólares", "chávenas" match the ASCII-only unit regex
  let t=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  // Currency symbols (speech recognition often writes "euros" as "€"): "€2" / "2€" / "para €" → codes
  for(const[s,c] of SYM2CODE){
    if(!t.includes(s))continue;
    const e=_reEsc(s);
    t=t.replace(new RegExp(e+'\\s*(\\d[\\d.,]*)','g'),(_,n)=>n+' '+c+' ').replace(new RegExp(e,'g'),' '+c+' ');
  }
  t=t.replace(/\s+/g,' ').trim();
  // Portuguese multi-word units -> compact tokens (the unit regex allows at most two words)
  t=t.replace(/colher(es)? de sopa/g,'tbsp').replace(/colher(es)? de cha/g,'tsp')
     .replace(/(quilometros?|km) por hora/g,'kph').replace(/milhas? por hora/g,'mph')
     .replace(/metros? por segundo/g,'mps').replace(/pes? por segundo/g,'fps')
     .replace(/quilometros? por litro/g,'kml').replace(/milhas? por galao/g,'mpg')
     .replace(/litros? (aos|por) 100 ?(km|quilometros)|l\/100 ?km|\bl100\b/g,'lhkm')
     .replace(/dolar(es)? de singapura/g,'sgd').replace(/dolar(es)? de hong kong/g,'hkd');
  // Spelled-out numbers work when typed too: "dois euros", "vinte e cinco km", "twenty five km"
  t=normalizeEN(ptWordsToNum(t.replace(/\s+/g,' '))).replace(/(\d)\s*(virgula|ponto)\s*(\d)/g,'$1.$3')
     .replace(/(\d+(?:\.\d+)?) ([a-z]+) e 0\.5\b/g,(_,n,u)=>(parseFloat(n)+.5)+' '+u);
  // Portuguese connectors: "para" / "em" -> "to"
  return t.replace(/\s+(para|em)\s+/g,' to ');
}
function parseInput(raw){
  const t=prepInput(raw);if(!t)return null;
  // Range
  const rm=RR.exec(t);
  if(rm){const v1=parseFloat(rm[1]),v2=parseFloat(rm[2]),fu=resolveUnit(rm[3]);
    if(fu&&!isNaN(v1)&&!isNaN(v2)){const tu=rm[4]?resolveUnit(rm[4]):null;return{type:'range',v1,v2,fromUnit:fu,toUnit:tu,category:getCat(fu),value:v1};}}
  // Chain
  const ch=RC.exec(t);
  if(ch){const v1=parseFloat(ch[1]),v2=parseFloat(ch[3]),u1=resolveUnit(ch[2]),u2=resolveUnit(ch[4]),tu=ch[5]?resolveUnit(ch[5]):null;
    if(u1&&u2&&!isNaN(v1)&&!isNaN(v2)&&getCat(u1)===getCat(u2)){
      const cat=CAT[getCat(u1)];
      if(!cat.special){const base=(v1*cat.units[u1].f)+(v2*cat.units[u2].f),val=base/cat.units[cat.base].f;
        return{type:'chain',value:val,fromUnit:cat.base,toUnit:tu,category:getCat(u1),chainLabel:fmt(v1)+cat.units[u1].sym+' + '+fmt(v2)+cat.units[u2].sym};}}}
  // Formula
  const fm=RF.exec(t);
  if(fm&&/[\+\-\*\/\(\)]/.test(fm[1])){
    const val=safeEval(fm[1]),fu=resolveUnit(fm[2]);
    if(!isNaN(val)&&fu){const tu=fm[3]?resolveUnit(fm[3]):null;
      return{type:'formula',value:val,fromUnit:fu,toUnit:tu,category:getCat(fu),formulaLabel:fm[1].trim()+'='+fmt(val)};}}
  // Standard
  const m=RM.exec(t);
  if(m){const value=parseFloat(m[1].replace(/,/g,''));if(isNaN(value))return null;
    const rawU=m[2].toLowerCase().trim();
    if(POUNDISH.includes(rawU)&&!m[3])return{type:'ambig',value,opts:[{label:'ambWeight',unit:'lb'},{label:'ambCur',unit:'gbp'}]};
    let fu=resolveUnit(m[2]);if(!fu)return null;
    let tu=m[3]?resolveUnit(m[3]):null;
    // "pound"/"libra" next to a currency or crypto means GBP, not weight
    const isFin=k=>k&&(getCat(k)==='currency'||getCat(k)==='crypto');
    if(tu&&POUNDISH.includes(m[3].toLowerCase().trim())&&isFin(fu))tu='gbp';
    if(tu&&POUNDISH.includes(rawU)&&isFin(tu))fu='gbp';
    const cat=getCat(fu);if(!cat)return null;
    const tc=tu?getCat(tu):null;
    const crossFin=tc&&tc!==cat&&((cat==='crypto'&&tc==='currency')||(cat==='currency'&&tc==='crypto'));
    const displayCat=crossFin?tc:(!tu&&cat==='crypto'?'currency':cat);
    return{type:'standard',value,fromUnit:fu,toUnit:tu,category:cat,displayCat};}
  // Reverse lookup
  const um=RU.exec(t);
  if(um){const fu=resolveUnit(um[1]);
    if(fu){const tc2=null,cat2=getCat(fu);const tu=um[2]?resolveUnit(um[2]):null;const displayCat=!tu&&cat2==='crypto'?'currency':cat2;return{type:'standard',value:1,fromUnit:fu,toUnit:tu,category:cat2,displayCat,isReverse:true};}}
  return null;
}

function showSugg(parsed){
  const{value,fromUnit,category}=parsed;
  const cat=CAT[category];
  const sk=(cat.sugg&&cat.sugg[fromUnit])||Object.keys(cat.units).filter(k=>k!==fromUnit);
  $sg.innerHTML='';
  sk.slice(0,3).forEach((tk,i)=>{
    const tu=cat.units[tk]||CAT[getCat(tk)]?.units[tk];if(!tu)return;
    const res=convert(value,fromUnit,tk);
    const fr=fmtFrac(res,tk);
    const card=document.createElement('div');card.className='sc';card.style.borderColor=cat.color+'30';card.style.animationDelay=i*.05+'s';
    card.innerHTML='<div class="scl" style="color:'+cat.color+'">'+tu.label+'</div><div class="scv">'+fmt(res)+'<span class="scs">'+tu.sym+'</span></div>'+(fr?'<div class="scf">'+fr+'</div>':'');
    card.onclick=()=>{$inp.value=value+' '+fromUnit+' to '+tk;processInput(true);};
    $sg.appendChild(card);
  });
  $sg.style.display='grid';
}
function hideSugg(){$sg.style.display='none';}

// ── RESULT CARD ──────────────────────────────────────────
function buildRows(parsed,sort,cmpP){
  const{value,fromUnit,toUnit,category,chainLabel,formulaLabel,type,v1,v2}=parsed;
  const dCat=parsed.displayCat||category;
  const cat=CAT[dCat];const fromCat=CAT[category];
  const fuData=fromCat.units[fromUnit]||{label:fromUnit.toUpperCase(),sym:fromUnit.toUpperCase()};
  const pins=getPins(dCat);
  $rrows.innerHTML='';
  // Range header
  if(type==='range'&&toUnit){
    const r1=convert(v1,fromUnit,toUnit),r2=convert(v2,fromUnit,toUnit);
    const tuData=CAT[getCat(toUnit)]?.units[toUnit]||{sym:toUnit};
    const d=document.createElement('div');d.className='rng';
    d.innerHTML='<div class="rngl">'+tr('range')+' · '+fuData.sym+' → '+tuData.sym+'</div><div class="rngr"><div class="rngi"><span class="rngs">'+fmt(v1)+' '+fuData.sym+'</span><span>'+fmt(r1)+' '+tuData.sym+'</span></div><div style="color:var(--sub);align-self:center">→</div><div class="rngi"><span class="rngs">'+fmt(v2)+' '+fuData.sym+'</span><span>'+fmt(r2)+' '+tuData.sym+'</span></div></div>';
    $rrows.appendChild(d);
  }
  // Source row
  const src=document.createElement('div');src.className='rsrc';
  const f0=fmtFrac(value,fromUnit);
  let srcH='<span class="rsrcv">'+fmt(value)+'</span><span class="rsrcu">'+fuData.label+' ('+fuData.sym+')</span>';
  if(f0)srcH+='<span class="rsrcf">'+f0+'</span>';
  if(chainLabel)srcH+='<span class="rsrcu">= '+chainLabel+'</span>';
  if(formulaLabel)srcH+='<span class="rsrcu">= '+formulaLabel+'</span>';
  if(cmpP){const cv=convert(cmpP.value,cmpP.fromUnit,fromUnit);if(cv!==null)srcH+='<span class="rsrcc">vs '+fmt(cv)+' '+fuData.sym+'</span>';}
  src.innerHTML=srcH;$rrows.appendChild(src);
  // Other units — from display category
  let others=Object.entries(cat.units).filter(([k])=>k!==fromUnit);
  if(sort==='asc')others.sort((a,b)=>{const av=convert(value,fromUnit,a[0])??0,bv=convert(value,fromUnit,b[0])??0;return av-bv;});
  else if(sort==='desc')others.sort((a,b)=>{const av=convert(value,fromUnit,a[0])??0,bv=convert(value,fromUnit,b[0])??0;return bv-av;});
  else if(sort==='az')others.sort((a,b)=>a[1].label.localeCompare(b[1].label));
  else{const ps=new Set(pins);const pn=others.filter(([k])=>ps.has(k));const rs=others.filter(([k])=>!ps.has(k));others=[...pn,...rs];}
  others.forEach(([key,unit],i)=>{
    const res=convert(value,fromUnit,key);const isPinned=pins.includes(key);const isHL=key===toUnit;const fr=fmtFrac(res,key);
    const absVal=res===null?0:Math.abs(res);
    const row=document.createElement('div');row.className='rr'+(isHL?' hl':'')+(isPinned?' pr':'');
    row.dataset.absval=absVal;
    const cv=fmt(res)+' '+unit.sym,qd=fmt(value)+' '+fuData.sym+' = '+cv;
    // Sparkline for crypto units
    const spark=(dCat==='crypto'&&unit.spark)?renderSpark(unit.spark,CAT.crypto.color):'';
    const ch24=unit.ch24;
    const chHtml=ch24!==undefined?'<span class="'+(ch24>=0?'spark-up':'spark-dn')+'" style="font-size:9px;margin-right:3px">'+(ch24>=0?'+':'')+ch24.toFixed(1)+'%</span>':'';
    let cmpH='';
    if(cmpP){const cv2=convert(cmpP.value,cmpP.fromUnit,key);if(cv2!==null)cmpH='<span class="rcmp">vs '+fmt(cv2)+'</span>';}
    row.innerHTML='<button class="rpn'+(isPinned?' pon':'')+'" data-key="'+key+'" title="'+(isPinned?tr('tUnpin'):tr('tPin'))+'">'+(isPinned?'★':'☆')+'</button><span class="rlbl">'+unit.label+'</span>'+chHtml+spark+cmpH+'<span class="rval">'+fmt(res)+'</span>'+(fr?'<span class="rfrac">'+fr+'</span>':'')+'<span class="rsym">'+unit.sym+'</span><div class="racts"><button class="ra" data-v="'+cv+'" title="'+tr('tCopy')+'">'+CSVGs+'</button><button class="ra raqr" data-q="'+qd+'" title="'+tr('tQR')+'">▦</button></div>';
    $rrows.appendChild(row);
    if((sort==='default'||sort==='az')&&i===2&&others.length>3&&!pins.length){const dv=document.createElement('div');dv.className='rdiv';$rrows.appendChild(dv);}
  });
  // Note
  if(dCat==='currency'||dCat==='crypto'){
    const n=document.createElement('div');n.className='fnote';
    const s=CAT[dCat].liveStatus;
    n.textContent=s==='live'?tr('liveRates',Math.round((Date.now()-CAT[dCat].lastUpdate)/60000)):tr('demoRates');
    $rrows.appendChild(n);
  }
  // Wire pins
  $rrows.querySelectorAll('.rpn').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();togglePin(dCat,btn.dataset.key);buildRows(parsed,ST.sort,ST.compareParsed);}));
  // Wire copy
  $rrows.querySelectorAll('.ra:not(.raqr)').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const v=btn.dataset.v;navigator.clipboard.writeText(v).catch(()=>{});btn.innerHTML=CKSVGs;btn.classList.add('ok');toast(tr('copied')+v);setTimeout(()=>{btn.innerHTML=CSVGs;btn.classList.remove('ok');},2200);}));
  // Wire QR
  $rrows.querySelectorAll('.raqr').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();openQR(btn.dataset.q);}));
  // Proportion bars + reset nav
  _navIdx=-1;
  requestAnimationFrame(addPropBars);
}

function expand(parsed){
  if(!parsed||parsed.type==='ambig')return;
  _cur=parsed;
  const dCat=parsed.displayCat||parsed.category;
  const cat=CAT[dCat];const fromCat=CAT[parsed.category];
  $iz.classList.add('cond');hideSugg();
  $rct.textContent=cat.label+' · '+(fromCat.units[parsed.fromUnit]?.sym||parsed.fromUnit);
  $rct.style.color=cat.color;
  document.querySelectorAll('.sp').forEach(b=>{b.classList.toggle('act',b.dataset.sort===ST.sort);b.style.background=b.classList.contains('act')?cat.color:'';});
  buildRows(parsed,ST.sort,ST.compareParsed);
  $rc.style.display='block';ST.cardOpen=true;
  pushHash();
  addHistory(parsed);
}

function closeCard(){
  $rc.style.display='none';ST.cardOpen=false;$iz.classList.remove('cond');

}

// ── COMPARE ──────────────────────────────────────────────
function processCompare(){
  const raw=$ci.value.trim();
  if(!raw){ST.compareParsed=null;buildRows(_cur,ST.sort,null);return;}
  const p=parseInput(raw);

function exportResults(fmt_){
  if(!_cur)return;
  const{value,fromUnit,category}=_cur;

  const cat=CAT[dCat];const fromCat=CAT[category];
  const fuData=fromCat.units[fromUnit]||{label:fromUnit.toUpperCase(),sym:fromUnit.toUpperCase()};
  const others=Object.entries(cat.units).filter(([k])=>k!==fromUnit);
  const rows=others.map(([k,u])=>[u.label,fmt(convert(value,fromUnit,k)),u.sym]);
  let text='';
  if(fmt_==='md'){text='| Unit | Value | Symbol |\n|---|---|---|\n| '+fuData.label+' | '+fmt(value)+' | '+fuData.sym+' |\n';rows.forEach(([l,v,s])=>text+='| '+l+' | '+v+' | '+s+' |\n');}
  else if(fmt_==='csv'){text='Unit,Value,Symbol\n'+fuData.label+','+fmt(value)+','+fuData.sym+'\n';rows.forEach(([l,v,s])=>text+=l+','+v+','+s+'\n');}
  else{const obj={from:{unit:fuData.label,symbol:fuData.sym,value:fmt(value)},conversions:{}};rows.forEach(([l,v,s])=>obj.conversions[l]={value:v,symbol:s});text=JSON.stringify(obj,null,2);}
  navigator.clipboard.writeText(text).catch(()=>{});
  toast(tr('copiedRows',fmt_.toUpperCase(),rows.length+1));
  $em.classList.remove('vis');
}

// ── MAIN PROCESS ─────────────────────────────────────────
function processInput(autoExpand=false){
  const raw=$inp.value;
  if(!raw.trim()){clearGhost();clearBadge();hideSugg();hideAmbig();if(ST.cardOpen){$rc.style.display='none';ST.cardOpen=false;$iz.classList.remove('cond');}$ul.classList.remove('on');setHint('');ST.parsed=null;return;}
  const parsed=parseInput(raw);ST.parsed=parsed;
  if(!parsed){clearGhost();clearBadge();hideSugg();hideAmbig();$ul.classList.add('on');setHint(tr('hintTry'));return;}
  if(parsed.type==='ambig'){clearGhost();hideSugg();$ul.classList.add('on');setHint(tr('hintAmbig'));showAmbig(parsed.opts,parsed.value);return;}
  hideAmbig();
  const{fromUnit,toUnit,category,type}=parsed;const value=parsed.value;const cat=CAT[category];
  setBadge(category);$ul.classList.add('on');
  if(toUnit){
    const res=convert(value,fromUnit,toUnit);const fr=fmtFrac(res,toUnit);
    const toSym=CAT[getCat(toUnit)]?.units[toUnit]?.sym||toUnit.toUpperCase();
    setGhost(raw,' = '+fmt(res)+' '+toSym+(fr?' '+fr:''));
    const dCat=parsed.displayCat||category;
    setHint(tr('hintAll',CAT[dCat].label.toLowerCase()),CAT[dCat].color+'BB');
    if(!ST.cardOpen)hideSugg();
  } else if(type==='range'){
    const sk=(cat.sugg?.[fromUnit])||Object.keys(cat.units).filter(k=>k!==fromUnit);
    if(sk[0]){const r1=convert(parsed.v1,fromUnit,sk[0]),r2=convert(parsed.v2,fromUnit,sk[0]);const s0sym=(cat.units[sk[0]]||CAT[getCat(sk[0])]?.units[sk[0]])?.sym||sk[0];setGhost(raw,' → '+fmt(r1)+'–'+fmt(r2)+' '+s0sym);}
    setHint(tr('hintRange'));
    if(!ST.cardOpen)showSugg({value:parsed.v1,fromUnit,category,type:'standard'});
  } else {
    const sk=(cat.sugg?.[fromUnit])||Object.keys(cat.units).filter(k=>k!==fromUnit);
    if(sk[0]){const r=convert(value,fromUnit,sk[0]);const fr=fmtFrac(r,sk[0]);const s0sym=(cat.units[sk[0]]||CAT[getCat(sk[0])]?.units[sk[0]])?.sym||sk[0];setGhost(raw,' → '+fmt(r)+' '+s0sym+(fr?' '+fr:''));}
    setHint(parsed.isReverse?tr('hintReverse',cat.units[fromUnit].label):tr('hintExpand'));
    if(!ST.cardOpen)showSugg(parsed);
  }
  if(autoExpand)expand(parsed);
}

// Sparkline renderer (48×14 SVG from 7-day price array)
function renderSpark(prices,color){
  if(!prices||prices.length<2)return'';
  const step=Math.max(1,Math.floor(prices.length/28));
  const pts=prices.filter((_,i)=>i%step===0).slice(0,28);
  const mn=Math.min(...pts),mx=Math.max(...pts),rng=mx-mn||1;
  const W=52,H=14;
  const d=pts.map((p,i)=>(i===0?'M':'L')+(i/(pts.length-1)*W).toFixed(1)+','+(H-(p-mn)/rng*H).toFixed(1)).join(' ');
  return'<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="flex-shrink:0;margin:0 4px;opacity:.75;vertical-align:middle"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

// Proportion bars — run after buildRows populates rrows
function addPropBars(){

  });
}

// Multi-value paste — detect newline-separated numbers, convert all
function handlePaste(e){
  const text=e.clipboardData.getData('text');
  const lines=text.trim().split(/\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)return;
  const first=parseInput(lines[0]);
  if(!first||!first.fromUnit)return;
  e.preventDefault();
  const results=lines.map(l=>{
    const numMatch=l.match(/^[\d,]+\.?\d*/);
    const val=numMatch?parseFloat(numMatch[0].replace(/,/g,'')):NaN;
    if(isNaN(val))return null;
    return{val,results:first.toUnit?convert(val,first.fromUnit,first.toUnit):null};
  }).filter(Boolean);
  const toSym=first.toUnit?(CAT[getCat(first.toUnit)]?.units[first.toUnit]?.sym||first.toUnit):'';
  const fromSym=CAT[first.category]?.units[first.fromUnit]?.sym||first.fromUnit;
  const text2=results.map(r=>fmt(r.val)+' '+fromSym+(r.results!==null?' → '+fmt(r.results)+' '+toSym:'')).join('\n');
  navigator.clipboard.writeText(text2).catch(()=>{});
  toast(tr('copiedVals',results.length));
}

};
// English spoken-number cleanup
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100,thousand:1000};
function normalizeEN(t){
  let s=t.toLowerCase().trim().replace(/[.,!?]+$/,'');
  s=s.replace(/degrees?\s+(fahrenheit|celsius|celcius|kelvin)/g,'$1');
  s=s.replace(/\b(twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)[\s-]+(one|two|three|four|five|six|seven|eight|nine)\b/g,(_,a,b)=>NUMW[a]+NUMW[b]);
  s=s.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|thousand)\b(?=\s+[a-z])/g,m=>NUMW[m]);
  s=s.replace(/(\d)\s*point\s*(\d)/g,'$1.$2');
  return s.replace(/\s+/g,' ');
}
// European Portuguese spoken-number cleanup (accent-free keys)
const PTN={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,catorze:14,quatorze:14,quinze:15,dezasseis:16,dezesseis:16,dezassete:17,dezessete:17,dezoito:18,dezanove:19,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,quatrocentas:400,quinhentos:500,quinhentas:500,seiscentos:600,seiscentas:600,setecentos:700,setecentas:700,oitocentos:800,oitocentas:800,novecentos:900,novecentas:900,mil:1000,meio:.5,meia:.5};
function ptWordsToNum(s){
  const w=s.split(' '),out=[];let i=0;
  while(i<w.length){
    if(PTN[w[i]]!==undefined){
      let j=i,total=0,cur=0;
      // consume a run like "dois mil e quinhentos" / "vinte e cinco"
      while(j<w.length&&(PTN[w[j]]!==undefined||(w[j]==='e'&&PTN[w[j+1]]!==undefined))){
        if(w[j]==='mil'){total+=(cur||1)*1000;cur=0;}
        else if(w[j]!=='e')cur+=PTN[w[j]];
        j++;
      }
      out.push(String(total+cur));i=j;
    }else{out.push(w[i]);i++;}
  }
  return out.join(' ');
}
function normalizePT(t){
  let s=t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[!?]+$/,'').replace(/\.$/,'');
  // digits from the recogniser: "1.000" -> 1000, "2,5" -> 2.5
  s=s.replace(/(\d)\.(\d{3})(?!\d)/g,'$1$2').replace(/(\d),(\d)/g,'$1.$2');
  // "graus celsius" -> "celsius" so it isn't read as an angle
  s=s.replace(/graus?\s+(celsius|centigrados|fahrenheit|kelvin)/g,'$1');
  // filler at the start: "converte", "quanto é", "quantos são"
  s=s.replace(/^(converter|converte|quanto e|quanto sao|quantos sao|quantas sao|quanto valem?)\s+/,'');
  s=ptWordsToNum(s.replace(/\s+/g,' '));
  // "2 vírgula 5" / "2 ponto 5" -> 2.5
  s=s.replace(/(\d)\s*(virgula|ponto)\s*(\d)/g,'$1.$3');
  // "2 horas e meia" -> "2.5 horas"
  s=s.replace(/(\d+(?:\.\d+)?) ([a-z]+) e 0\.5\b/g,(_,n,u)=>(parseFloat(n)+.5)+' '+u);
  return s.replace(/\s+/g,' ').trim();
}
function normalizeSpoken(t){return voiceLang==='pt'?normalizePT(t):normalizeEN(t);}

  $micbtn.addEventListener('click',()=>{
    if(listening){rec.stop();return;}
    const L=VOICE_TXT[voiceLang];
    rec=new SR();
    rec.lang=L.code;
    rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
    rec.onstart=()=>{listening=true;$micbtn.classList.add('listening');setHint(L.listen);};
    rec.onresult=e=>{
      let t='';for(const r of e.results)t+=r[0].transcript;
      $inp.value=normalizeSpoken(t);
      processInput(e.results[e.results.length-1].isFinal);
    };
    rec.onerror=e=>{toast(e.error==='not-allowed'||e.error==='service-not-allowed'?L.blocked:e.error==='no-speech'?L.nospeech:L.err+e.error);};
    rec.onend=()=>{listening=false;$micbtn.classList.remove('listening');if(!$inp.value)setHint('');};
    try{rec.start();}catch{}
  });
}

const DN_PT=(()=>{try{return new Intl.DisplayNames(['pt-PT'],{type:'currency'});}catch{return null;}})();
function curSym(code){try{return new Intl.NumberFormat('en',{style:'currency',currency:code,currencyDisplay:'symbol'}).formatToParts(1).find(p=>p.type==='currency').value;}catch{return code;}}
function curName(dn,code){try{return dn?.of(code)||code;}catch{return code;}}
const plainKey=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
// Register a currency name as an alias (spaced and compact forms), never overriding another unit
// Portuguese plural of one word: dolar→dolares, real→reais, neozelandes→neozelandeses, iene→ienes
function pluralPT(w){if(/[aeiou]$/.test(w))return w+'s';if(/[aeou]l$/.test(w))return w.slice(0,-1)+'is';if(/m$/.test(w))return w.slice(0,-1)+'ns';if(/(r|z|es)$/.test(w))return w+'es';return w;}
function addAlias(name,k,pt){if(!name)return;const n=plainKey(name);const forms=[n];if(pt)forms.push(n.split(' ').map(pluralPT).join(' '));forms.forEach(f=>[f,f.replace(/\s+/g,'')].forEach(a=>{if(a&&!ALIAS[a]&&!getCat(a))ALIAS[a]=k;}));}
function addCurrency(code,rate){
  const k=code.toLowerCase(),cur=CAT.currency.units;
  if(cur[k]){if(rate>0)cur[k].rate=rate;return true;}
  // Skip anything that would clash with an existing unit or alias (e.g. CUP = cup)
  if(!/^[a-z]{3}$/.test(k)||getCat(k)||ALIAS[k]||!(rate>0))return false;
  const en=curName(DN_EN,code);let pt=curName(DN_PT,code);pt=pt.charAt(0).toUpperCase()+pt.slice(1);
  const sym=curSym(code);
  cur[k]={label:voiceLang==='pt'?pt:en,sym,rate,label_en:en,sym_en:sym};
  PT_UNITS.currency[k]=pt;
  addAlias(en,k);addAlias(pt,k,true);
  return true;
}

// ── AUTO-FIT INPUT ───────────────────────────────────────
// Shrinks the input + ghost text so the whole query and its result fit on one line.
var _fitEl;
function fitInput(){
  if(!$inp||!$ghost)return;
  const avail=$inp.clientWidth;if(!avail)return;
  $inp.style.fontSize='';$ghost.style.fontSize='';
  const cs=getComputedStyle($inp),base=parseFloat(cs.fontSize);if(!base)return;
  // keep the box height fixed so the layout doesn't jump while text shrinks
  $inp.parentElement.style.minHeight=Math.ceil(base*1.2)+'px';
  if(!_fitEl){_fitEl=document.createElement('span');_fitEl.setAttribute('aria-hidden','true');_fitEl.style.cssText='position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre;pointer-events:none';document.body.appendChild(_fitEl);}
  _fitEl.style.fontFamily=cs.fontFamily;_fitEl.style.fontWeight=cs.fontWeight;_fitEl.style.letterSpacing=cs.letterSpacing;_fitEl.style.fontSize=base+'px';
  _fitEl.textContent=$ghost.textContent||$inp.value||$inp.placeholder||'';
  const w=_fitEl.getBoundingClientRect().width;
  if(w>avail){const size=Math.max(15,Math.floor(base*avail/w*0.97));$inp.style.fontSize=size+'px';$ghost.style.fontSize=size+'px';}
  syncGhostScroll();
}
// If the text still overflows at the minimum size, keep the ghost aligned with the input's scroll
function syncGhostScroll(){$ghost.style.transform=$inp.scrollLeft?'translateX('+(-$inp.scrollLeft)+'px)':'';}
['keyup','click','scroll','select','focus'].forEach(ev=>$inp.addEventListener(ev,syncGhostScroll));
